name: Download Images

on:
  workflow_dispatch:
    inputs:
      gallery_url:
        description: "Ссылка на галерею (например https://site.com/g/3601564/6519838fc7/)"
        required: true
        type: string
      max_pages:
        description: "Сколько страниц пагинации пробовать (?p=1..N)"
        required: false
        default: "4"
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run downloader
        run: |
          python downloader.py "${{ inputs.gallery_url }}" \
            --output downloads \
            --max-pages "${{ inputs.max_pages }}"

      - name: Upload downloaded images as artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-images
          path: downloads/
          if-no-files-found: warn
