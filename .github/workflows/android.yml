name: Android build

on:
  push:
    branches: [main]
    paths:
      - "android_app/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android_app/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: android_app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate platform scaffolding (android/)
        run: |
          flutter create --platforms=android --project-name lmf_app .
          rm -rf test

      - name: Bump compileSdk/targetSdk to 36
        run: |
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$f" ]; then
              sed -i \
                -e 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 36/' \
                -e 's/compileSdk flutter\.compileSdkVersion/compileSdk 36/' \
                -e 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 36/' \
                -e 's/targetSdk = flutter\.targetSdkVersion/targetSdk = 36/' \
                -e 's/targetSdk flutter\.targetSdkVersion/targetSdk 36/' \
                -e 's/targetSdkVersion flutter\.targetSdkVersion/targetSdkVersion 36/' \
                "$f"
            fi
          done

      - name: Analyze
        run: flutter analyze

      - name: Build APK (release)
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: lmf-app-release-apk
          path: android_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
